<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Maria Decorações</title>
    <link rel="stylesheet" href="/css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header class="d-flex flex-column align-items-center mt-3">
        <img src="/images/logo/logo_dmaria.png" alt="logo" class="w-25">
        <div class="page-links d-flex gap-4 fw-semibold">

            <!-- colocar a cor verde nos text e tirar subline -->
            <a href="" class="link-underline link-underline-opacity-0 text-color-main">Início</a>
            <a href="" class="link-underline link-underline-opacity-0 text-color-main">Produtos</a>
            <a href="" class="link-underline link-underline-opacity-0 text-color-main">Sobre Nós</a>
            <a href="" class="link-underline link-underline-opacity-0 text-color-main">Contatos</a>
        </div>
    </header>

    <main class="container d-flex flex-column gap-4">
        <section class="notice mt-5 text-center">
            <p class="fw-bold fs-3">Aqui está nosso catálogo!</p>
            <p class="fw-semibold fs-5">Escolha os kits já prontos para sua festa!</p>
        </section>

        <section class="category-options d-flex">
            <div class="option-button"></div>
            <input type="radio" name="bolo-fake" id="bolo-fake" name="categoryFilter" class="btn-check"
                value="bolo-fake">
            <label for="bolo-fake" class="btn">Bolo Fake</label>

            <input type="radio" name="pegue-monte" id="pegue-monte" name="categoryFilter" class="btn-check"
                value="pegue-monte" checked>
            <label for="pegue-monte" class="btn">Kit Pegue e Monte</label>

            <input type="radio" name="mini-kits" id="mini-kits" name="categoryFilter" class="btn-check"
                value="mini-kits">
            <label for="mini-kits" class="btn">Mini Kits</label>

            <input type="radio" name="pegue-monte" id="pegue-monte" name="categoryFilter" class="btn-check"
                value="pegue-monte">
            <label for="pegue-monte" class="btn">Kit Pegue e Monte</label>

            <input type="radio" name="mesas" id="mesas" name="categoryFilter" class="btn-check" value="mesas">
            <label for="mesas" class="btn">Mesas</label>

            <input type="radio" name="tapetes" id="tapetes" name="categoryFilter" class="btn-check" value="tapetes">
            <label for="tapetes" class="btn">Tapetes</label>

            <input type="radio" name="adicionais" id="adicionais" name="categoryFilter" class="btn-check"
                value="adicionais">
            <label for="adicionais" class="btn">Adicionais</label>





        </section>
    </main>









    <script src="https://kit.fontawesome.com/b624667e59.js" crossorigin="anonymous"></script> <!-- font awesome -->
</body>

</html>
